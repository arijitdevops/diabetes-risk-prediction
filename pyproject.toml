[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-risk-prediction"
version = "0.1.0"
description = "Leakage-aware multiclass diabetes risk classifier with a Flask front end"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["machine-learning", "scikit-learn", "flask", "healthcare", "tabular"]

dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.9,<1.10",
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "Flask>=3.0,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
]

[project.scripts]
drp-prepare = "src.prepare_data:main"
drp-train = "src.train:main"
drp-evaluate = "src.evaluate:main"
drp-predict = "src.predict:main"

[tool.setuptools]
packages = ["src", "app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/errors/*.html", "static/css/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
